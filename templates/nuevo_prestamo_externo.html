{% extends "base.html" %}

{% block content %}
<div class="container mt-4">
    <div class="row justify-content-center">
        <div class="col-md-8">
            <div class="card shadow">
                <div class="card-header bg-info text-white">
                    <h4 class="mb-0">
                        <i class="fas fa-user me-2"></i>
                        Préstamo Externo - {{ libro.titulo }}
                    </h4>
                </div>
                <div class="card-body">
                    <!-- Información del libro -->
                    <div class="alert alert-info">
                        <h6><i class="fas fa-book me-2"></i>Información del Libro</h6>
                        <strong>Título:</strong> {{ libro.titulo }}<br>
                        <strong>Autor:</strong> {{ libro.autor }}<br>
                        <strong>Cota:</strong> {{ libro.cota }}
                    </div>

                    <form method="POST">
                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label class="form-label">
                                    <i class="fas fa-user me-1"></i>Nombre *
                                </label>
                                <input type="text" name="nombre" class="form-control" required>
                            </div>
                            <div class="col-md-6 mb-3">
                                <label class="form-label">
                                    <i class="fas fa-user me-1"></i>Apellido *
                                </label>
                                <input type="text" name="apellido" class="form-control" required>
                            </div>
                            <div class="col-md-6 mb-3">
                                <label class="form-label">
                                    <i class="fas fa-id-card me-1"></i>Cédula o DNI *
                                </label>
                                <input type="text" name="cedula" class="form-control" required>
                            </div>
                            <div class="col-md-6 mb-3">
                                <label class="form-label">
                                    <i class="fas fa-map-marker-alt me-1"></i>Dirección *
                                </label>
                                <input type="text" name="direccion" class="form-control" required>
                            </div>
                            <div class="col-md-6 mb-3">
                                <label class="form-label">
                                    <i class="fas fa-phone me-1"></i>Teléfono *
                                </label>
                                <input type="text" name="telefono" class="form-control" required>
                            </div>
                            <div class="col-md-6 mb-3">
                                <label class="form-label">
                                    <i class="fas fa-envelope me-1"></i>Correo electrónico *
                                </label>
                                <input type="email" name="email" class="form-control" required>
                            </div>
                            <div class="col-md-6 mb-3">
                                <label class="form-label">
                                    <i class="fas fa-building me-1"></i>Institución (opcional)
                                </label>
                                <input type="text" name="institucion" class="form-control" placeholder="Institución educativa o empresa">
                            </div>
                            <div class="col-md-6 mb-3">
                                <label class="form-label">
                                    <i class="fas fa-briefcase me-1"></i>Cargo (opcional)
                                </label>
                                <input type="text" name="cargo" class="form-control" placeholder="Cargo o función">
                            </div>
                            <div class="col-md-6 mb-3">
                                <label class="form-label">
                                    <i class="fas fa-calendar me-1"></i>Fecha de préstamo
                                </label>
                                <input type="date" name="fecha_prestamo" class="form-control" 
                                       value="{{ fecha_prestamo.strftime('%Y-%m-%d') }}" required>
                            </div>
                            <div class="col-md-6 mb-3">
                                <label class="form-label">
                                    <i class="fas fa-calendar-check me-1"></i>Fecha estimada de devolución
                                </label>
                                <input type="date" name="fecha_devolucion" class="form-control" 
                                       value="{{ fecha_devolucion.strftime('%Y-%m-%d') }}" required>
                            </div>
                            <div class="col-12 mb-3">
                                <label class="form-label">
                                    <i class="fas fa-sticky-note me-1"></i>Observaciones
                                </label>
                                <textarea name="observaciones" class="form-control" rows="3" placeholder="Información adicional sobre el préstamo..."></textarea>
                            </div>
                        </div>
                        
                        <div class="d-flex justify-content-between">
                            <a href="{{ url_for('detalle_libro', id=libro.id) }}" class="btn btn-secondary">
                                <i class="fas fa-arrow-left me-1"></i> Cancelar
                            </a>
                            <button type="submit" class="btn btn-success">
                                <i class="fas fa-check me-1"></i> Registrar Préstamo
                            </button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
