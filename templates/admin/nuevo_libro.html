{% extends "base.html" %} {% block content %}
<div class="container mt-4">
  <div class="row">
    <div class="col-md-12">
      <nav aria-label="breadcrumb">
        <ol class="breadcrumb">
          <li class="breadcrumb-item">
            <a href="{{ url_for('admin') }}">Panel de Administración</a>
          </li>
          <li class="breadcrumb-item active">Nuevo Libro</li>
        </ol>
      </nav>
    </div>
  </div>

  <div class="row">
    <div class="col-md-12">
      <div class="card shadow">
        <div class="card-header bg-primary text-white">
          <h3 class="mb-0">Agregar Nuevo Libro</h3>
        </div>
        <div class="card-body">
          <!-- enctype necesario para subir archivos -->
          <form method="POST" enctype="multipart/form-data">
            <div class="row">
              <!-- Columna izquierda -->
              <div class="col-md-6">
                <h4 class="mb-3">Información General</h4>

                <div class="mb-3">
                  <label for="titulo" class="form-label">Título *</label>
                  <input
                    type="text"
                    class="form-control"
                    id="titulo"
                    name="titulo"
                    required
                  />
                </div>

                <div class="mb-3">
                  <label for="autor" class="form-label">Autor *</label>
                  <input
                    type="text"
                    class="form-control"
                    id="autor"
                    name="autor"
                    required
                  />
                </div>

                <div class="mb-3">
                  <label for="cota" class="form-label">COTA *</label>
                  <input
                    type="text"
                    class="form-control"
                    id="cota"
                    name="cota"
                    required
                  />
                </div>

                <div class="mb-3">
                  <label for="editorial" class="form-label">Editorial</label>
                  <input
                    type="text"
                    class="form-control"
                    id="editorial"
                    name="editorial"
                  />
                </div>

                <div class="mb-3">
                  <label for="anio_edicion" class="form-label"
                    >Año de edición</label
                  >
                  <input
                    type="number"
                    class="form-control"
                    id="anio_edicion"
                    name="anio_edicion"
                    min="1000"
                    max="{{ current_year }}"
                    placeholder="Ej. 2024"
                  />
                </div>

                <div class="mb-3">
                  <label for="ciudad" class="form-label">Ciudad</label>
                  <input
                    type="text"
                    class="form-control"
                    id="ciudad"
                    name="ciudad"
                  />
                </div>

                <div class="mb-3">
                  <label for="coleccion" class="form-label">Colección</label>
                  <input
                    type="text"
                    class="form-control"
                    id="coleccion"
                    name="coleccion"
                  />
                </div>
              </div>

              <!-- Columna derecha -->
              <div class="col-md-6">
                <h4 class="mb-3">Detalles Físicos</h4>

                <div class="mb-3">
                  <label for="medidas" class="form-label">Medidas</label>
                  <input
                    type="text"
                    class="form-control"
                    id="medidas"
                    name="medidas"
                  />
                </div>

                <div class="mb-3">
                  <label for="num_paginas" class="form-label"
                    >Número de páginas</label
                  >
                  <input
                    type="text"
                    class="form-control"
                    id="num_paginas"
                    name="num_paginas"
                    min="1"
                  />
                </div>

                <div class="mb-3">
                  <label for="caract_formato" class="form-label">Formato</label>
                  <input
                    type="text"
                    class="form-control"
                    id="caract_formato"
                    name="caract_formato"
                  />
                </div>

                <div class="mb-3">
                  <label for="cant_ejemplares" class="form-label"
                    >Cantidad de ejemplares</label
                  >
                  <input
                    type="number"
                    min="1"
                    class="form-control"
                    id="cant_ejemplares"
                    name="cant_ejemplares"
                    value="1"
                  />
                </div>

                <div class="mb-3">
                  <label for="tomos" class="form-label">Tomos</label>
                  <input
                    type="text"
                    class="form-control"
                    id="tomos"
                    name="tomos"
                  />
                </div>

                <div class="mb-3">
                  <label for="verificacion" class="form-label"
                    >Verificación</label
                  >
                  <input
                    type="text"
                    class="form-control"
                    id="verificacion"
                    name="verificacion"
                  />
                </div>

                <div class="mb-3">
                  <label for="materias" class="form-label">Materias</label>
                  <textarea
                    class="form-control"
                    id="materias"
                    name="materias"
                    rows="3"
                  ></textarea>
                </div>

                <!-- Portada del libro -->
                <div class="mb-3">
                  <label for="portada" class="form-label"
                    >Portada del Libro</label
                  >
                  <input
                    type="file"
                    class="form-control"
                    id="portada"
                    name="portada"
                    accept="image/*"
                    onchange="if(this.files[0] && this.files[0].size > 5*1024*1024){ alert('La imagen no puede superar los 5 MB'); this.value=''; }"
                  />
                  <small class="form-text text-muted">
                    Formatos permitidos: JPG, PNG, GIF. Tamaño máximo: 5 MB.
                  </small>
                </div>
              </div>
            </div>

            <!-- Botones -->
            <div class="row mt-4">
              <div class="col-md-12 d-flex gap-2">
                <button type="submit" class="btn btn-primary">
                  Guardar Libro
                </button>
                <a href="{{ url_for('admin') }}" class="btn btn-secondary"
                  >Cancelar</a
                >
              </div>
            </div>
          </form>
        </div>
      </div>
    </div>
  </div>
</div>
{% endblock %}
